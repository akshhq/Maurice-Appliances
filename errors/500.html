<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>500 — Something went wrong — Maurice Appliances</title>
<link rel="icon" href="/assets/images/icons/favicon.svg" type="image/svg+xml">
<style>
  :root { --red:#E01E26; --ink:#141518; --graphite:#3A3D42; --paper:#FBFBFA; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);
       color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:2rem;text-align:center;
       -webkit-font-smoothing:antialiased}
  .logo{font-weight:700;font-size:1.5rem;color:var(--red);letter-spacing:-.02em;margin-bottom:2.5rem;
        display:inline-block;text-decoration:none}
  .code{color:var(--red);font-weight:700;font-size:.8125rem;letter-spacing:.14em;text-transform:uppercase;
        display:inline-flex;align-items:center;gap:.75rem}
  .code::before{content:"";width:26px;height:2px;border-radius:2px;
        background:linear-gradient(90deg,var(--ink),#FF6A3D,var(--red))}
  h1{font-size:clamp(1.9rem,1.4rem+2vw,2.7rem);line-height:1.2;letter-spacing:-.02em;margin:1rem 0}
  p{color:var(--graphite);max-width:48ch;margin:0 auto 2rem;line-height:1.6}
  a.btn{display:inline-block;background:var(--red);color:#fff;padding:.9em 1.6em;border-radius:999px;
        text-decoration:none;font-weight:600;font-size:.9375rem;transition:transform .18s,box-shadow .36s}
  a.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(224,30,38,.22)}
</style>
</head>
<body>
  <div>
    <a class="logo" href="/">maurice<sup style="font-size:.5em">&reg;</sup></a>
    <p class="code">Error 500</p>
    <h1>Something went wrong</h1>
    <p>We hit an unexpected error on our end. Please try again in a moment.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
